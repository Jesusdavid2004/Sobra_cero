name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app-backend/requirements.txt
      - run: pytest --cov=app.domain --cov=app.application --cov-fail-under=70 app-backend/tests
        env: { PYTHONPATH: app-backend }
      - run: black --check app-backend/app app-backend/tests
      - run: isort --check-only app-backend/app app-backend/tests
      - run: flake8 app-backend/app app-backend/tests
      - run: mypy app-backend/app
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app-frontend/package-lock.json }
      - run: npm install
        working-directory: app-frontend
      - run: npm run build
        working-directory: app-frontend
      - run: npm run format:check
        working-directory: app-frontend

name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app-backend/requirements.txt
      - run: pytest --cov=app.domain --cov=app.application --cov-fail-under=70 app-backend/tests
        env: { PYTHONPATH: app-backend }
      - run: black --check app-backend/app app-backend/tests
      - run: isort --check-only app-backend/app app-backend/tests
      - run: flake8 --max-line-length=120 --extend-ignore=E203,W503 app-backend/app app-backend/tests
      - run: mypy --config-file app-backend/pyproject.toml app-backend/app/domain app-backend/app/application

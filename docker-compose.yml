services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sobracero
      POSTGRES_PASSWORD: sobracero
      POSTGRES_DB: sobracero
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  localstack:
    image: localstack/localstack:3.5.0
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports: ["4566:4566"]
    volumes: ["localstack_data:/var/lib/localstack"]
  backend:
    build: ./app-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sobracero:sobracero@postgres:5432/sobracero
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: localstack:4566
      MINIO_PUBLIC_URL: http://localhost:4566
    ports: ["8000:8000"]
    depends_on: [postgres, redis, localstack]
  worker:
    build: ./app-backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sobracero:sobracero@postgres:5432/sobracero
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  frontend:
    build: ./app-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  localstack_data: